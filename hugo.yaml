      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: eyesoffslp
  # authorimage: ../assets/images/global/author.webp
  # og_image: assets/flockcamera.jpg
  moto: "End Mass Surveillance in St. Louis Park"
  description: "We are working to end the use of AI-powered Automated License Plate Readers (ALPRs) in St. Louis Park and protect our community's privacy."
  disable_theme_toggle: false
  disable_stay_uptodate: true

  p1:
    heading: "What is an ALPR?"
    image: "../assets/flockcamera.jpg"
    content:
      - text: >
          Automated License Plate Readers (ALPRs) are camera systems that automatically scan and record license plate numbers and vehicle 
          information as cars pass by. These systems can capture thousands of plate images per minute and feed the data into searchable databases. 
          Law enforcement agencies argue that ALPRs help locate stolen vehicles and identify suspects in criminal investigations. However, the technology 
          captures data on every vehicle—not just those involved in crimes—meaning millions of law-abiding citizens are routinely photographed and tracked
           without their knowledge or consent.

  p2:
    heading: "2511 Immigration Queries"
    image: "../assets/GettyImages-2255536197.jpg"
    content:
      - text: >
          St. Louis Park's Flock Safety license plate readers were queried by outside agencies 2,511 times for immigration enforcement between January 2025 and April 2026. 
          Homeland Security Investigations logged 1,330 distinct lookups, 
          while an additional 826 searches targeted ICE picks-ups, warrants, and active field operations. At the extreme end of out-of-state use, a single 
          agency in Michigan executed deportation warrant tracking over three consecutive months, showing how a local road network in Minnesota became embedded 
          in a nationwide immigration dragnet.

      - text: >
          To be clear: St. Louis Park Police themselves did not record any searches that listed immigration as the reason for the search. However,
          we have shared it with dozens of agencies with opposing values, who may use our data to target our residents and visitors
          in a way we would never allow our own department to do. So why did we let others? 
